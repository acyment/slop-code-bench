schema_version: 1
matrix_id: mini_screen_c2
description: Meaningful reduced-drift mini-screen Gherkin plus executable acceptance run matrix for checkpoints 1-3, replacing file_backup with migrate_configs after EXP-100X/EXP-100Y.
status: ready_to_run
checkpoint_limit: 3
condition:
  id: C2
  spec_context: gherkin_executable_package
  gherkin_context_visible: true
  acceptance_harness_visible: true
  acceptance_harness_runnable: true
  acceptance_feedback_policy:
    mode: harness_mediated_repair_loop
    enforcement: harness_mediated
    scorer_rerun_after_checkpoint: true
    invalid_if_not_executed: true
    max_repair_attempts: 1
    timeout_seconds: 300
    notes: Native runner executes visible acceptance after each checkpoint draft, feeds visible failures back for one repair attempt, then scorer reruns visible acceptance on the saved snapshot.
  hidden_tests_visible_to_agent: false
  prompt_template: experiment/prompts/gherkin_executable.md
  completion_policy: pass visible acceptance checks and native hidden SCBench core checks after each checkpoint
problems:
  - code_search
  - migrate_configs
replicates:
  - replicate_id: 1
    seed: 7101
  - replicate_id: 2
    seed: 7102
  - replicate_id: 3
    seed: 7103
model:
  provider: codex_auth
  name: gpt-5.3-codex-spark
  temperature: 0
  notes: Fixed across mini-screen C0/C1/C2 for the first meaningful reduced-drift probe.
agent_harness:
  id: codex
  version: 0.128.0
  notes: Local Codex CLI authenticated through codex_auth.
runner:
  benchmark_repo: SprocketLab/slop-code-bench
  benchmark_commit: 03bf1f56752bdb4dc3e607d291870972ddd5f214
  problem_repo: gabeorlanski/scb-problems
  problem_commit: 8be2bd10bad43a3c0068bdafd05f8eb065a7dc80
  native_environment: configs/environments/docker-python3.12-uv.yaml
  pass_policy: core-cases
  thinking: low
  num_workers: 1
outputs:
  run_root: experiment/runs/mini_screen_c2
  normalized_results_jsonl: experiment/results/mini_screen_c2_checkpoint_results.jsonl
  artifact_manifest: experiment/results/mini_screen_c2_artifacts.json
lock_policy:
  mode: manifest_before_after_checkpoint
  locked_paths:
    - experiment/features/**
    - experiment/steps/**
    - experiment/prompts/**
    - experiment/scripts/**
    - experiment/schemas/**
    - experiment/locks/**
  violation_policy: mark_protocol_violation_and_exclude_primary
