schema_version: 1
matrix_id: mini_screen_c0
description: Meaningful reduced-drift mini-screen baseline prose run matrix for checkpoints 1-3, replacing file_backup with migrate_configs after EXP-100X/EXP-100Y.
status: ready_to_run
checkpoint_limit: 3
condition:
  id: C0
  spec_context: native_prose
  gherkin_context_visible: false
  acceptance_harness_visible: false
  acceptance_harness_runnable: false
  hidden_tests_visible_to_agent: false
  prompt_template: experiment/prompts/baseline_prose.md
  completion_policy: pass native hidden SCBench core checks after each checkpoint
problems:
  - code_search
  - migrate_configs
replicates:
  - replicate_id: 1
    seed: 7101
  - replicate_id: 2
    seed: 7102
  - replicate_id: 3
    seed: 7103
model:
  provider: codex_auth
  name: gpt-5.3-codex-spark
  temperature: 0
  notes: Fixed across mini-screen C0/C1/C2 for the first meaningful reduced-drift probe.
agent_harness:
  id: codex
  version: 0.128.0
  notes: Local Codex CLI authenticated through codex_auth.
runner:
  benchmark_repo: SprocketLab/slop-code-bench
  benchmark_commit: 03bf1f56752bdb4dc3e607d291870972ddd5f214
  problem_repo: gabeorlanski/scb-problems
  problem_commit: 8be2bd10bad43a3c0068bdafd05f8eb065a7dc80
  native_environment: configs/environments/docker-python3.12-uv.yaml
  pass_policy: core-cases
  thinking: low
  num_workers: 1
outputs:
  run_root: experiment/runs/mini_screen_c0
  normalized_results_jsonl: experiment/results/mini_screen_c0_checkpoint_results.jsonl
  artifact_manifest: experiment/results/mini_screen_c0_artifacts.json
lock_policy:
  mode: none
  locked_paths: []
  violation_policy: not_applicable
