    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp002.prior-rules-order
      - migrate_configs.cp001.basic-rules
    reason: Through-checkpoint C2 runs execute checkpoint 1 scenarios, and the checkpoint 2 regression runner combines prior and new rules while checking lexicographic rules_applied order.
  - problem_id: migrate_configs
    checkpoint_index: 3
    feature_scenario: Array filter pattern updates matching elements only
    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp003.arrays-and-inheritance
    reason: The checkpoint 3 runner updates only services[?enabled=true].host and verifies the disabled service host remains unchanged.
  - problem_id: migrate_configs
    checkpoint_index: 3
    feature_scenario: Inheritance merges parent configs before applying rules
    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp003.arrays-and-inheritance
    reason: The checkpoint 3 runner resolves root-to-base-to-child JSON inheritance, verifies child overrides, inherited fields, directive removal, and post-inheritance rule application.
  - problem_id: migrate_configs
    checkpoint_index: 3
    feature_scenario: Circular inheritance fails before modifying files
    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp003.errors-and-skips
    reason: The checkpoint 3 runner creates a YAML inheritance cycle, expects a non-zero exit with a circular-dependency error, and verifies files are unchanged.
  - problem_id: migrate_configs
    checkpoint_index: 3
    feature_scenario: Missing array filter matches and missing template variables skip without output
    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp003.errors-and-skips
    reason: The checkpoint 3 runner verifies missing array-filter matches and unresolved template variables leave the target JSON unchanged with empty stdout.
  - problem_id: file_backup
