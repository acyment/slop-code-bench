    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp002.patterns-templates-conditions
    reason: The checkpoint 2 runner verifies a YAML s3.bucket value rendered from environment and aws.region variables.
  - problem_id: migrate_configs
    checkpoint_index: 2
    feature_scenario: Conditional replacement only applies when the condition matches
    coverage: executable
    runner_scenario_ids:
      - migrate_configs.cp002.patterns-templates-conditions
    reason: The checkpoint 2 runner verifies a localhost match is replaced while a staging host remains unchanged and unreported.
  - problem_id: migrate_configs
    checkpoint_index: 2
