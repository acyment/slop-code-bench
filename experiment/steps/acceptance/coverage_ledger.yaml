    reason: The checkpoint 3 runner exercises optional metavariables, exact omission of captures for absent optional values, literal $$ matching, multiple captures, language filtering, capture key ordering, and deterministic file/position ordering.
  - problem_id: code_search
    checkpoint_index: 3
    feature_scenario: Multiline Python patterns preserve capture boundaries
    coverage: executable
